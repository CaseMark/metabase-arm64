name: Dependency vulnerability scan

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - preview
      - bench/OP-194-dependency-scanner
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-audit:
    name: Container dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metabase
            image: metabase/metabase
          - name: metabase-arm64
            image: stephaneturquay/metabase-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan upstream image dependency
        id: audit
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: dependency-scan-results.json
          exit-code: "1"
          timeout: 15m0s

      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-dependency-audit-${{ matrix.name }}-${{ github.sha }}
          path: |
            dependency-scan-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce vulnerability gate
        if: steps.audit.outcome != 'success'
        run: |
          echo "The dependency audit found vulnerabilities or could not complete; review the retained evidence." >&2
          exit 1
